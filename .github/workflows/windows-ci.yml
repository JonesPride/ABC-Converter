name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Restore
        shell: pwsh
        run: .\scripts\Setup.ps1
      - name: Audit NuGet dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $json = dotnet list .\ABC.Converter.sln package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audit = $json | ConvertFrom-Json
          $vulnerable = @(
            foreach ($project in $audit.projects) {
              foreach ($framework in $project.frameworks) {
                foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                  if ($null -ne $package.vulnerabilities -and $package.vulnerabilities.Count -gt 0) {
                    [pscustomobject]@{
                      Project = $project.path
                      Framework = $framework.framework
                      Package = $package.id
                      Version = $package.resolvedVersion
                      Vulnerabilities = ($package.vulnerabilities | ConvertTo-Json -Compress)
                    }
                  }
                }
              }
            }
          )
          if ($vulnerable.Count -gt 0) {
            $vulnerable | Format-Table -AutoSize | Out-String | Write-Error
            throw 'Vulnerable NuGet dependencies detected.'
          }
          Write-Host 'No known vulnerable NuGet dependencies detected.'
      - name: Build
        shell: pwsh
        run: .\scripts\Build.ps1 -Configuration Release
      - name: Test
        shell: pwsh
        run: .\scripts\Test.ps1 -Configuration Release
